name: Build & Release APK

# 触发方式：
# 1. push 到 main 分支 —— 仅构建验证（不出 Release）
# 2. push v* 标签   —— 构建并创建 GitHub Release
# 3. workflow_dispatch —— 手动触发，可指定发布标签名（默认 v1.1.0）
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签名（留空则仅构建验证）'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write   # 允许创建 Release 与上传产物

jobs:
  build:
    name: 签名构建 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # ============ 签名私钥：从 Actions Secrets 注入，绝不入库 ============
      - name: 还原签名 keystore（来自 Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 未配置，请在仓库 Settings > Secrets 添加"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/wuying-release.jks
          echo "keystore 大小: $(wc -c < keystore/wuying-release.jks) 字节"

      - name: 构建签名 Release APK
        env:
          KEYSTORE_FILE: keystore/wuying-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ============ 产物校验 ============
      - name: 校验 APK 签名
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK ($(du -h "$APK" | cut -f1))"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | head -5

      - name: 重命名产物
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "WuyingBrowser-v${VERSION}-release.apk"
          ls -la WuyingBrowser-*.apk

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WuyingBrowser-APK
          path: WuyingBrowser-*.apk
          retention-days: 30

      # ============ 正式发布：tag push 或手动 dispatch ============
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: WuyingBrowser ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## 无影浏览器 WuyingBrowser

            > 自签名 Release APK，直接下载安装即可。

            ### 本版本亮点
            - 🪟 悬浮窗版浏览器：可拖动小窗、双档尺寸、收起为气泡贴边
            - 🔔 伪装驻留通知：常驻通知栏低调伪装，**点击通知直接拉起悬浮窗浏览器**
            - 🛡️ 广告拦截 / 下载管理 / 书签历史 / 会话恢复
            - ♻️ 双进程守护 + 心跳保活 + 开机自启
            - 🔐 自签名（keystore 通过 Actions Secrets 注入，源码不含私钥）

            ### 校验
            - 包名：`com.wuying.browser`
            - 签名指纹 SHA-256：`F6:9F:D9:3E:4C:F8:D5:E1:A1:4E:C2:A9:1F:8E:98:39:09:9B:BB:03:C0:AA:DF:29:58:D4:42:E8:72:E3:60:C1`
          draft: false
          prerelease: false
          files: WuyingBrowser-*.apk
